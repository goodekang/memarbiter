# Evaluation protocol (main text Section 6).

seeds: [13, 31, 47, 67, 89]
n_bootstrap: 10000
holm_family_by: table
memory_budget_tokens: 4096
planning:
  decoding: deterministic
  reasoning_effort: lowest
judge:
  model: gpt-5.6-terra
  human_agreement: 0.947
  n_human_labels: 300
confidence_elicitation: true
dev_split:
  n_instances: 200
  source: held_out_distractor_sessions

suites:
  conflict:
    split: data/persist/conflict/test.jsonl
    metrics: [dynamic_acc, static_acc, conditional_acc, cr_f1, spr, hit_at_5, abstain_precision]
  poison:
    split: data/persist/poison/test.jsonl
    # asr_t1: first trigger, before repair (prevention; reported as E2E-ASR)
    # asr_t2: trigger re-issued from the restored pre-trigger environment after
    #         the first-trigger records are discarded and repair is applied
    #         (recurrence); configurations without repair are re-issued too.
    # srsr / brr: pooled over poisoned records within reach of repair and over
    #         benign records in the neighbourhood of the flagged step.
    metrics: [mpsr, asr_t1, asr_t2, verifier_coverage, srsr, brr, fel_at_1, fel_at_3, clean_utility]
    reissue_trigger: true
  public:
    split: data/public/longmemeval_s.jsonl
    agentdojo_split: data/public/agentdojo.jsonl
    longmemeval_s: {ku: 78, abstention: 30, all: 500}
    locomo: {adversarial: 446, all: 1986}
    memoryagentbench_fc: 1800
    agentdojo: {tasks: 97, cases: 629, suite_cases: [240, 105, 140, 144]}
    asb: {memory_poisoning: 400, mixed: 400}
    agentpoison: 300
    minja: {ehragent: 200, rap: 200}

default_backbone: gpt-5.6-sol
default_system: memarbiter
output_dir: outputs
