# Ablation switches (Table 10 and the controlled analyses). Each variant is
# merged over the `ablation` section of memarbiter.yaml; several variants can
# be combined with commas.

variants:
  full:
    provenance_tags: true
    write_time_adjudication: true
    read_time_scorer: true
    trust_update: true
    quarantine_gate: true
    conflict_classifier: hybrid
    escalation_backbone: null
    counterfactual_reexecution: true
    corroboration: restricted
    lineage: typed
  # Update rules reverted one at a time (Section 7.12, Table A.2), or both.
  unrestricted_corroboration:
    corroboration: unrestricted
  untyped_lineage:
    lineage: untyped
  original_rules:
    corroboration: unrestricted
    lineage: untyped
  no_provenance:
    provenance_tags: false
  no_adjudication:
    write_time_adjudication: false
  no_scorer:
    read_time_scorer: false
  no_trust_update:
    trust_update: false
  no_quarantine:
    quarantine_gate: false
  nli_only:
    conflict_classifier: nli_only
  llm_only:
    conflict_classifier: llm_only
  no_counterfactual:
    counterfactual_reexecution: false
  # Off-the-shelf MNLI classifier (Fig. 18c): escalation to the backbone,
  # to DeepSeek-V4-Pro, or none.
  mnli:
    conflict_classifier: mnli
  mnli_deepseek_escalation:
    conflict_classifier: mnli
    escalation_backbone: deepseek-v4-pro
  mnli_no_escalation:
    conflict_classifier: mnli_no_escalation
